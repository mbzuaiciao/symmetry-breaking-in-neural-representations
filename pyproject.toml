[project]
name = "symmetry-breaking-in-neural-representations"
version = "0.1.0"
description = "A rigorous, intuitive tutorial and experimental lab on symmetry, representation geometry, and symmetry breaking in neural networks"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Symmetry Reps Team" }
]
dependencies = [
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "torch>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.350",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/symmetry_reps"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests", "experiments"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
